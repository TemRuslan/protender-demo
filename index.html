<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Панель ProTender</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left menu + one working column; on phones the menu becomes a drawer. White, quiet, one blue accent. */
:root{
  --bg:#FFFFFF; --surface:#F6F7F9; --surface-2:#EEF0F4; --line:#E3E6EC; --line-strong:#CDD2DB;
  --ink:#151A23; --muted:#5D6573; --faint:#8A919D;
  --accent:#2B4FB5; --accent-ink:#FFFFFF; --accent-soft:#EDF1FB;
  --ok:#1F7A45; --ok-soft:#E7F3EC; --warn:#9A5800; --warn-soft:#FBF0DF; --danger:#B3261E; --danger-soft:#FBEAE8;
  --screen:#1E2430; --screen-2:#2A3140;
  --font:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px; --r-sm:7px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.brand b{font-size:17px;letter-spacing:-.01em}
.demo{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:2px 8px;margin-left:auto}
.company{display:flex;align-items:center;gap:10px;padding:10px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);width:100%;text-align:left}
.company small{display:block;color:var(--muted);font-size:12px}
.company .chev{margin-left:auto;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.limit{padding:10px;border-radius:var(--r);background:var(--surface);font-size:13px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.me{display:flex;align-items:center;gap:10px;padding:4px 8px;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font-size:19px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .crumb{color:var(--muted);text-decoration:none;font-weight:500}
.top .sp{margin-left:auto}
.menu-btn{display:none;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:6px 10px}
.stop{border:1px solid var(--danger);color:var(--danger);background:var(--bg);border-radius:var(--r-sm);padding:7px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.stop:hover{background:var(--danger-soft)}
.stop i{width:8px;height:8px;border-radius:2px;background:var(--danger)}
.content{padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1180px;width:100%}

/* parts */
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;display:inline-grid;place-items:center}
.badge.grey{background:var(--surface-2);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.danger{background:var(--danger-soft);color:var(--danger)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.btn{border:1px solid var(--line-strong);background:var(--bg);border-radius:var(--r-sm);padding:8px 14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--line-strong)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec-h h2{font-size:16px;font-weight:600}
.sec-h a{color:var(--accent);text-decoration:none;font-size:14px;font-weight:500}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.list > *{border-top:1px solid var(--line)} .list > *:first-child{border-top:0}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:var(--r);background:var(--surface)}
.kpi span{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.hl{background:var(--accent-soft)} .kpi.hl b{color:var(--accent)}

.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* decision card */
.dec{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.dec .t{font-weight:600}
.dec .meta{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.dec .acts{grid-row:span 2;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dec.gone{opacity:0;transform:translateX(12px);transition:.25s}

/* deadline */
.dl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:11px 14px;align-items:center}
.dl .d{font-weight:600;font-size:13px;line-height:1.25}
.dl .d small{display:block;font-weight:400;color:var(--muted)}
.dl.urgent .d{color:var(--danger)}

/* robots mini */
.rb{display:flex;gap:12px;padding:11px 14px;align-items:center}
.rb-ic{width:32px;height:32px;border-radius:8px;background:var(--surface);display:grid;place-items:center;flex:none;font-size:13px;font-weight:600;color:var(--muted)}
.rb-ic.on{background:var(--ok-soft);color:var(--ok)}
.rb .tx{min-width:0;flex:1}
.rb .tx b{font-weight:600;font-size:14px}
.rb .tx div{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tenders */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:500;display:flex;gap:6px;align-items:center}
.chip span{color:var(--faint);font-weight:500}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)} .chip.on span{color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 12px;background:var(--bg)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface)}
td .t{font-weight:500;display:block;min-width:240px}
td .s{color:var(--muted);font-size:12.5px}
.r{text-align:right}

/* tender detail */
.thead{display:flex;flex-direction:column;gap:12px}
.thead h2{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--bg);padding:11px 14px}
.facts span{display:block;font-size:12.5px;color:var(--muted)}
.facts b{font-weight:600}
.reco{border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.reco.yes{background:var(--ok-soft)} .reco.no{background:var(--danger-soft)}
.reco .v{display:flex;gap:10px;align-items:center;font-weight:600;font-size:16px}
.reco.yes .v{color:var(--ok)} .reco.no .v{color:var(--danger)}
.reco p{margin:0;max-width:70ch}
.reco .by{font-size:12.5px;color:var(--muted)}
.decide{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;align-items:center;border:1px solid var(--line);border-radius:var(--r)}
.decide .q{font-weight:600;margin-right:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.req{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:start}
.req .n{color:var(--faint);font-size:13px;padding-top:1px}
.req .ref{font-size:12.5px;color:var(--accent);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.req .note{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0}
.kv > div{padding:11px 14px;border-top:1px solid var(--line)}
.kv > div:nth-child(-n+2){border-top:0}
.kv .r{font-weight:600}
.kv .tot{background:var(--surface)}
.doc{display:flex;align-items:center;gap:12px;padding:11px 14px}
.doc .ic{width:32px;height:40px;border:1px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--muted);flex:none}
.doc .tx{flex:1;min-width:0}
.hist{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 14px;font-size:14px}
.hist .when{color:var(--muted);font-size:13px}

/* computer */
.screen-wrap{display:flex;flex-direction:column;gap:12px}
.screen-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:var(--r-sm);background:var(--ok-soft);color:var(--ok);font-weight:500;font-size:14px;min-width:0}
.status .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 0 rgba(31,122,69,.5);animation:p 1.8s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(31,122,69,0)}100%{box-shadow:0 0 0 0 rgba(31,122,69,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.cursor{transition:none}}
.screen{background:var(--screen);border-radius:var(--r);padding:12px;aspect-ratio:16/9.4;max-width:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.win{flex:1;background:#fff;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:0;color:#1d2330}
.win-top{background:#E9ECF1;display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px}
.win-top .tab{background:#fff;border-radius:6px 6px 0 0;padding:4px 10px;max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win-url{background:#fff;border-bottom:1px solid #E3E6EC;padding:5px 10px;font-size:12px;color:#5D6573;display:flex;gap:8px;align-items:center}
.lock{width:9px;height:9px;border:1.5px solid #1F7A45;border-radius:2px}
.win-body{flex:1;display:grid;grid-template-columns:190px 1fr;min-height:0}
.wb-side{background:#F4F6F9;border-right:1px solid #E3E6EC;padding:12px 10px;font-size:11.5px;display:flex;flex-direction:column;gap:6px;color:#5D6573}
.wb-side b{color:#1d2330;font-size:12px}
.wb-side .o{padding:5px 7px;border-radius:5px}
.wb-side .o.on{background:#DDE5F7;color:#22408F;font-weight:600}
.wb-main{padding:14px 18px;display:flex;flex-direction:column;gap:9px;font-size:12px;overflow:hidden}
.wb-main h4{margin:0;font-size:14px}
.fld{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.fld label{color:#5D6573}
.fld .in{border:1px solid #CDD2DB;border-radius:4px;padding:5px 8px;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld .in.fill{border-color:#2B4FB5;background:#F3F6FD}
.file{display:flex;gap:8px;align-items:center;border:1px dashed #CDD2DB;border-radius:4px;padding:5px 8px}
.file i{font-style:normal;color:#1F7A45;font-weight:600}
.sign{align-self:flex-start;background:#2B4FB5;color:#fff;border-radius:4px;padding:6px 14px;font-weight:600;margin-top:4px}
.cursor{position:absolute;width:16px;height:16px;left:62%;top:78%;transition:left 1.2s,top 1.2s;pointer-events:none}
.task{display:flex;gap:6px;align-items:center;padding:0 2px;color:#C9CED8;font-size:11.5px}
.task .tb{background:var(--screen-2);border-radius:4px;padding:3px 8px}
.task .tb.on{background:#3B4558;color:#fff}
.task .clock{margin-left:auto}
.approve-strip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft)}
.approve-strip .tx{flex:1;min-width:220px}
.approve-strip b{display:block}
.log{font-size:13.5px}
.log .hist{grid-template-columns:62px minmax(0,1fr)}

/* robots */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--bg)}
.rcard:hover{border-color:var(--line-strong);background:var(--surface)}
.rcard .h{display:flex;gap:10px;align-items:center}
.rcard .h b{font-size:15px}
.rcard .now{font-size:13.5px;color:var(--muted);min-height:40px}
.rcard .f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.lvl{display:inline-flex;gap:2px}
.lvl i{width:12px;height:6px;border-radius:2px;background:var(--surface-2)}
.lvl i.on{background:var(--accent)}

/* forms */
.form{display:flex;flex-direction:column}
.fr{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:8px 24px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}
.fr:first-child{border-top:0}
.fr > label,.fr > .lb{font-weight:500}
.fr .lb small,.fr > label small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.inp,.sel,textarea{border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 11px;background:var(--bg);width:100%;max-width:420px}
textarea{max-width:none;min-height:150px;font-size:13.5px;line-height:1.55;resize:vertical}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline .inp{max-width:180px}
.sw{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{width:38px;height:22px;border-radius:99px;background:var(--line-strong);position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked + i{background:var(--accent)}
.sw input:checked + i::after{left:19px}
.sw input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.tagset{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--surface-2);border-radius:var(--r-sm);padding:3px 9px;font-size:13px}
.tag.add{background:none;border:1px dashed var(--line-strong);color:var(--muted)}
.subnav{display:flex;gap:4px;flex-wrap:wrap}
.subnav a{padding:7px 12px;border-radius:var(--r-sm);text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
.subnav a.on{background:var(--surface);color:var(--ink)}
.lockcell{display:flex;align-items:center;gap:8px;color:var(--muted)}
.lockcell svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.conn{display:flex;gap:14px;align-items:center;padding:14px 16px}
.conn .lg{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--surface);color:var(--muted)}
.conn .tx{flex:1;min-width:0}
.conn .tx b{display:block}
.co{padding:16px;display:flex;flex-direction:column;gap:14px}
.co-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.co-h h3{font-size:17px;font-weight:600}
.co-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.co-grid span{display:block;font-size:12.5px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ph{aspect-ratio:4/3;border-radius:var(--r-sm);background:linear-gradient(160deg,#DCE3D6,#B9C6B0 60%,#9DAE93);position:relative;overflow:hidden;max-width:100%}
.ph.b{background:linear-gradient(160deg,#D9D6CF,#BDB6AA 55%,#8E877B)}
.ph.c{background:linear-gradient(170deg,#CFD8E3,#AFBCCB 60%,#8797AA)}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:11.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.step i{height:5px;border-radius:99px;background:var(--surface-2)}
.step.done i{background:var(--ok)} .step.cur i{background:var(--accent)} .step.cur{color:var(--ink);font-weight:500}

const TITLES={today:'Сегодня, 5 ноября',decisions:'Решения',tenders:'Тендеры',contracts:'Исполнение',contractors:'Подрядчики',computer:'Компьютер',robots:'Роботы'};
function route(){
  let h=(location.hash||'#today').slice(1);
  let html='',title='',nav=h;
  if(h.startsWith('tender-')){const t=T.find(x=>x.id===h.slice(7));html=vTender(h.slice(7));title=`<a class="crumb" href="#tenders">Тендеры</a> <span class="faint">/</span> ${t?t.title.split(' — ')[0].slice(0,60):''}`;nav='tenders'}
  else if(h.startsWith('robot-')){html=vRobot(h.slice(6));title='<a class="crumb" href="#robots">Роботы</a>';nav='robots'}
  else if(h.startsWith('prefs-')){const k=h.slice(6);html=vPrefs(PTABS.some(p=>p[0]===k)?k:'companies');title='Настройки';nav='prefs-companies'}
  else{const v={today:vToday,decisions:vDecisions,tenders:vTenders,contracts:vContracts,contractors:vContractors,computer:vComputer,robots:vRobots}[h]||vToday;html=v();title=TITLES[h]||TITLES.today;nav=TITLES[h]?h:'today'}
  $('#view').innerHTML=html;$('#title').innerHTML=title;renderNav(nav);
  $('#app').classList.remove('open');
  if(h==='computer')moveCursor();
}
let curT;
function moveCursor(){clearInterval(curT);const pts=[[62,78],[48,49],[44,57],[30,93],[62,78]];let i=0;curT=setInterval(()=>{const c=$('#cursor');if(!c){clearInterval(curT);return}i=(i+1)%pts.length;c.style.left=pts[i][0]+'%';c.style.top=pts[i][1]+'%'},1800)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function stopModal(){
  $('#modal').innerHTML=`<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Остановить всех роботов?</h3><p>Роботы прекратят работу на площадках и в переписке.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Отмена</button><button class="btn" style="background:var(--danger);border-color:var(--danger);color:#fff" data-confirm-stop>Остановить</button></div></div></div>`;
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){const d=D.find(x=>x.id===a.dataset.act);const i=+a.dataset.i;
    if(d&&d.acts[i]==='Открыть'){location.hash='tender-'+d.tid;return}
    if(d&&(i===0||d.acts[i]==='Не участвуем'||d.acts[i]==='Отклонить')){const el=a.closest('.dec');el.classList.add('gone');
      const msg={Участвуем:'Решение принято: участвуем','Не участвуем':'Решение принято: не участвуем','Одобрить подачу':'Подача одобрена','Утвердить':'Нижняя граница утверждена','Выбрать':'Подрядчик выбран','Принять правку':'Правка принята · проверяется на прошлых тендерах','Отклонить':'Правка отклонена'}[d.acts[i]]||'Готово';
      if(d.type==='Участие'){const t=T.find(x=>x.id===d.tid);if(t)t.stage=d.acts[i]==='Участвуем'?'prep':'declined'}
      setTimeout(()=>{D=D.filter(x=>x.id!==d.id);route();toast(msg)},250)} else if(d&&d.tid){location.hash='tender-'+d.tid}
    return}
  const go=e.target.closest('[data-go]'); if(go){location.hash=go.dataset.go;return}
  const tf=e.target.closest('[data-tf]'); if(tf){tFilter=tf.dataset.tf;route();return}
  const tt=e.target.closest('[data-tt]'); if(tt){tTab=tt.dataset.tt;route();return}
  const dt=e.target.closest('[data-dt]'); if(dt){document.querySelectorAll('#dchips .chip').forEach(c=>c.classList.toggle('on',c===dt));const v=dt.dataset.dt;$('#dlist').innerHTML=D.filter(d=>v==='Все'||d.type===v).map(decCard).join('')||'<div class="dec"><span class="muted">Нет решений</span></div>';return}
  const part=e.target.closest('[data-part]'); if(part){const t=T.find(x=>x.id===part.dataset.part);const yes=part.dataset.v==='1';t.stage=yes?'prep':'declined';D=D.filter(d=>!(d.tid===t.id&&d.type==='Участие'));route();toast(yes?'Участвуем · Составитель заявки начал работу':'Не участвуем · причина сохранена');return}
  const ts=e.target.closest('[data-toast]'); if(ts){toast(ts.dataset.toast);return}
  if(e.target.closest('#stopBtn')||e.target.closest('[data-stop]')){stopModal();return}
  if(e.target.closest('[data-close]')||e.target.id==='mbg'){$('#modal').innerHTML='';return}
  if(e.target.closest('[data-confirm-stop]')){$('#modal').innerHTML='';R.forEach(r=>r.on=false);route();toast('Все роботы остановлены');return}
  if(e.target.closest('#menuBtn')){$('#app').classList.add('open');return}
  if(e.target.closest('#scrim')){$('#app').classList.remove('open');return}
  if(e.target.closest('#companyBtn')){toast('Компании: ООО «Паритет»');return}
});
document.addEventListener('change',e=>{if(e.target.id==='rob-on'){const r=R.find(x=>'robot-'+x.id===location.hash.slice(1));if(r){r.on=e.target.checked;route();toast(r.on?r.n+' включён':r.n+' выключен')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#modal').innerHTML='';$('#app').classList.remove('open')}});
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#tender-'))tTab='req';route();window.scrollTo(0,0)});
route();
